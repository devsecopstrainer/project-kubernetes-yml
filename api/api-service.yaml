apiVersion: v1
kind: Service
metadata:
  name: idream-api-service
  namespace: idream
  labels:
    app: idream-api
spec:
  selector:
    app: idream-api
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  # ClusterIP — only accessible inside the cluster
  # Ingress will route /api/ traffic to this service
  type: ClusterIP
